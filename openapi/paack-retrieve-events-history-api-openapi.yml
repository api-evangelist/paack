                    updated_at: 2023-04-08 08:03:29.94546183 +0000 UTC
                    service_type: ST2
                    customer:
                      first_name: Darrick Jacobi
                      phone: '+34666666666'
                      email: example@paack.co
                    delivery_address:
                      city: Barcelona
                      country: ES
                      line1: Via Augusta 16
                      post_code: 08006
                    expected_delivery_ts:
                      start: '2023-04-08T16:11:00+00:00'
                      end: '2023-04-08T18:22:00+00:00'
                    expected_pickup_ts:
                      start: '2023-04-08T16:00:00+00:00'
                      end: '2023-04-08T16:01:00+00:00'
                    pick_up_address:
                      city: Barcelona
                      country: ES
                      line1: Avenida Diagonal 490
                      post_code: 08006
                    order_details:
                    - name: sale_number
                      type: string
                      value: 2e0a3987-b097-4879-bb40-f06be2221dcd
                    - name: paack_order_number
                      type: string
                      value: bf30ae81552ba68b761f-d299-479d-86fe-1d8a571b21c9
                    - name: retailer_order_number
                      type: string
                      value: a68b761f-d299-479d-86fe-1d8a571b21c9
                    delivery_instructions: Deliver to a neighbour
                    pick_up_instructions: The entrance is in Carrer Balmes
                error: []
                links: null
        '400':
          $ref: '#/components/responses/listResponse400'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/serverError'
      summary: List events
      x-summary-source: derived
components:
  schemas:
    Parcel:
      title: Parcel
      description: ' The Parcels included in the order.'
      type: object
      properties:
        barcode:
          description: ' Barcode identifier.'
          type: string
        height:
          description: ' The height of the parcel.'
          type: number
        id:
          description: ' Parcel UUID indentifier.'
          type: string
        length:
          description: ' The length of the parcel.'
          type: number
        order_id:
          description: The internal unique ID of an order in Paack.
          type: string
        status:
          description: Information about what is happening to a parcel.
          type: string
        weight:
          description: ' Parcel weight.'
          type: number
        width:
          description: ' Parcel width.'
          type: number
    DeliveryDetails:
      description: Option to show delivery events in details.
      example: true
      type: boolean
    Address:
      description: Address definition
      title: Address
      type: object
      properties:
        city:
          description: City.
          type: string
        country:
          description: Country in ISO 3166 alpha 2 format.
          type: string
          example: '`ES` `FR` `GB` `PT` `IT`'
        county:
          description: County or region.
          type: string
        line_1:
          description: Primary address.
          type: string
        line_2:
          description: Additional address information.
          type: string
        post_code:
          description: Zip code.
          type: string
    Detail:
      title: Detail
      type: object
      description: 'Specifies additional properties of the order. A property called `sale_number` stores the order''s custom identifier. Note that the properties are persisted by Paack although you cannot retrieve them through the GET method.


        The supported types are `string`, `number`, `boolean`, `object`, `array`, and `null`. For better user experience, only `string`, `number`, and `boolean` are displayed in this documentation.'
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: object
    statusListResponse:
      title: statusListResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
          description: ''
        error:
          $ref: '#/components/schemas/ResponseError'
      example:
