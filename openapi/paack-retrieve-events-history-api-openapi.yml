openapi: 3.2.0
info:
  title: Tracking Pull Retrieve events history API
  description: Documentation on using the Tracking Pull API
  contact:
    name: Find an up-to-date version of this API's docs in Confluence.
    url: https://paacklogistics.atlassian.net/wiki/spaces/PD/pages/3353903120/Pull+API
    email: tech.writers@paack.co
  version: 1.0.0
servers:
- url: https://tracking.paack.io
  description: Production environment
- url: https://tracking-sta.paack.io
  description: Staging environment
security:
- api_key: []
tags:
- name: Retrieve events history
paths:
  /api/v3/tracking/events:
    get:
      description: Retrieves the list of events. Querying is available with external IDs, sale numbers, time, and pagination. No query parameters returns all orders, 10 per response.
      operationId: list-events
      parameters:
      - name: externalIds
        in: query
        description: Comma-separated IDs of the orders for which to retrieve the events for.
        schema:
          $ref: '#/components/schemas/ExternalId'
      - name: saleNumbers
        in: query
        description: Comma-separated IDs of the orders for which to retrieve the events for.
        schema:
          $ref: '#/components/schemas/SaleNumber'
      - name: barcodes
        in: query
        description: Comma-separated barcodes of the orders for which to retrieve the events for. Note that you **cannot** receive an individual parcel querying by barcode because tracking is always done at order level. This query returns the order(s) that include this barcode.
        schema:
          $ref: '#/components/schemas/Barcode'
      - name: deliveryDetails
        in: query
        description: 'Sends detailed events for a delivery or a delivery attempt. For example if you use deliveryDetails you will get `SP004` - `DELIVERED THIRD PARTY` for orders delivered to a third party, otherwise you will always get  `SP003` - `DELIVERED` for all orders. The same will happen for delivery attempts, if you use deliveryDetails you will get further details about the delivery attempts, otherwise you''ll recieve `SA005` - `ATTEMPTED OTHER`. Existing events for delivery which you can get in case of using this parameter: `SP004` `Delivered to 3rd party` Events that will be available in the future for delivery: `SP022` `Delivered in safe place` `SP027` `Delivered to household member` Existing events for delivery attempts which you can get using this parameter: `SA012` - `ATTEMPTED DAMAGED` , `SA013` - `ATTEMPTED POD NOT PROVIDED` , `SA014` - `ATTEMPTED WEATHER OR DISTURBANCE` , `SA015` - `ATTEMPTED BUSINESS IS CLOSED`'
        schema:
          $ref: '#/components/schemas/DeliveryDetails'
      - name: start
        in: query
        description: 'UTC start date in ISO format to retrieve orders for a specific time period. Dates must be written like: `2022-08-01T13:00:00+00:00`. Note that no other date format will be accepted.'
        style: form
        schema:
          type: string
      - name: end
        in: query
        description: 'UTC end date in ISO format to retrieve orders for a specific time period. Dates must be written like: `2022-08-01T13:00:00+00:00`. Note that no other date format will be accepted.'
        style: form
        schema:
          type: string
      - name: before
        in: query
        description: ' To construct your pagination request, use the value of the `before` query parameter from the `links.prev.href` object in the response.'
        style: form
        explode: true
        schema:
          type: string
      - name: after
        in: query
        description: To construct your pagination request, use the value of the `after` query parameter from the `links.next.href` object in the response.
        style: form
        explode: true
        schema:
          type: string
      - name: count
        in: query
        description: Number of events to return in a single response. Minimum is 10, maximum is 100.
        style: form
        explode: true
        schema:
          type: integer
          minimum: 10
          maximum: 100
          default: 100
      tags:
      - Retrieve events history
      responses:
        '200':
          description: Confirms the success of the request. If the correct parameters have been specified and the data exists, it has been retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusListResponse'
              example:
                data:
                - attributes:
                    id: 798efcbc-2b9d-42b4-b74d-8f512a642234
                    tracking_id: 76472e43-2538-5937-a5a2-768420601245
                    external_id: a68b761f-d299-479d-86fe-1d8a571b21c9
                    tracking_url: https://t.paack.co/order_tracking?postal_code=08016&tracking_number=a68b761f-d299-479d-86fe-1d8a571b21c9
                    event_id: SP001
                    event_name: IN PROGRESS
                    order_status: draft
                    is_open: true
                    parcels:
                    - barcode: 3a368e5d-3f87-4945-8609-dfb8516b2dfd-1
                      height: 4.3
                      length: 3.6
                      weight: 9.8
                      width: 4.5
                    - barcode: 3a368e5d-3f87-4945-8609-dfb8516b2dfd-3
                      height: 4.3
                      length: 3.6
                      weight: 4.2
                      width: 2.5
                    - barcode: 3a368e5d-3f87-4945-8609-dfb8516b2dfd-2
