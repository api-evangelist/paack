    WindowObject:
      title: WindowObject
      description: Timeslot defined by the objects start and end.
      type: object
      properties:
        end:
          $ref: '#/components/schemas/WindowDatetime'
        start:
          $ref: '#/components/schemas/WindowDatetime'
    SaleNumber:
      description: Sale ID assigned by the retailer; unique within all the retailer's orders manifested to Paack. Can include special characters but excluding a comma. Note that if you use special characters in a sale number, you will have to convert them to retrieve the order through our tracking. For this reason, we recommend not using special characters.
      example: V3004
      type: string
    ExternalId:
      description: Order's ID assigned by the retailer; unique within all the retailer's orders manifested to Paack. Can include special characters but excluding a comma. Note that if you use special characters in an external ID, you will have to convert them to retrieve the order through our tracking. For this reason, we recommend not using special characters.
      example: 200000V3004
      type: string
    ResponseError:
      title: ResponseError
      type: object
      properties:
        msg:
          type: string
    Customer:
      title: Customer
      type: object
      properties:
        customer_details:
          description: customer data
          type: array
          items:
            $ref: '#/components/schemas/Detail'
        customer_type:
          type: string
        email:
          description: Customer's email address. Required if `phone` not provided.
          type: string
        external_id:
          $ref: '#/components/schemas/ExternalId'
        first_name:
          description: Customer's first name.
          type: string
        last_name:
          description: Customer's last name.
          type: string
        phone:
          description: Customer's phone number with the country prefix. Required if `email` not provided.
          type: string
    WindowDatetime:
      title: WindowDatetime
      type: object
      properties:
        date:
          type: string
        time:
          type: string
    OrderStatus:
      title: OrderStatus
      type: object
      properties:
        cod_currency:
          type: string
          description: Currency code in ISO 4217 format.
          enum:
          - EUR
          - GBP
        cod_value:
          description: Amount of cash on delivery.
          type: number
        customer:
          description: Customer name.
          $ref: '#/components/schemas/Customer'
        delivery_address:
          $ref: '#/components/schemas/Address'
        delivery_attempt:
          description: Number of delivery attempts made.
          type: integer
          format: int64
        delivery_instructions:
          description: Optional delivery instructions for Paack.
          type: string
        delivery_type:
          description: Whether delivery is direct or reverse.
          type: string
        event_description:
          description: Description of an event that happens on route. Events trigger information that affect an order's status in the Paack system.
          type: string
        event_id:
          description: Unique ID identifying an event.
          type: string
        event_name:
          description: Name of an event.
          type: string
        expected_delivery_ts:
          $ref: '#/components/schemas/WindowObject'
        expected_pick_up_ts:
          $ref: '#/components/schemas/WindowObject'
        external_order_id:
          description: Unique external identifier of an order.
          type: string
        id:
          description: Universal unique ID of the order returned by the Pull API. This is different from the order_id returned by the Order Management API.
          type: string
        insured_currency:
          description: Amount of money insured.
          type: string
        insured_value:
          format: double
          type: number
        is_open:
          description: A boolean value which is stored for each order.
          type: boolean
        order_details:
          type: array
          items:
            $ref: '#/components/schemas/Detail'
        order_id:
          description: The internal unique ID of an order in Paack.
          type: string
        order_status:
          description: Status of an order which gives information about what stage an order is at.
          type: string
        parcels:
          type: array
          items:
            $ref: '#/components/schemas/Parcel'
        parent_id:
          description: Unique order ID that is created and assigned to an order when a delivery attempt has failed.
          type: string
        pick_up_address:
          $ref: '#/components/schemas/Address'
        pick_up_instructions:
          description: Specific instructions for Paack to follow when picking up an order.
          type: string
        proof_of_delivery:
          description: Unique base 64 image that provides proof that a delivery was made.
          type: string
        retailer_id:
          description: A GUID identifying the retailer; assigned by Paack.
          type: string
        service_type:
          description: Code that identifies the delivery day type, timeslot type, and available slot length.
          type: string
          enum:
          - ST2 (Same day delivery)
          - NT2 (Next day delivery)
        tracking_id:
          description: The unique ID assigned to an order for tracking purposes.
          type: string
        tracking_url:
          description: The endpoint that stores the tracking data of an order. It is used to access the end customer tracking page.
          type: string
        updated_at:
          description: A timestamp field specifying when the order was updated.
          type: string
        vehicle_type:
          description: The type of vehicle used to make the order.
          type: string
    Barcode:
      description: Barcode identifier of a parcel within an order.
      example: '1223738849595004'
      type: string
  responses:
    unauthorizedError:
      description: Unauthorized because of a missing or expired token.
      content:
        application/json:
          schema:
            properties:
              code:
                description: HTTP response code.
                type: number
                enum:
                - 401
              message:
                description: Error details.
                type: string
                enum:
                - Jwt is missing
                - Jwt is expired
            example:
              code: 401
              message: Jwt is missing
    resourceNotFound:
      description: The order for the specified parameters could not be found.
      content:
        application/json:
          schema:
            properties:
              message:
                description: ''
                type: string
                enum:
                - Resource not found.
    listResponse400:
      description: Returned in case of validation errors.<br /><br />To ensure a correct validation of a request:<br />- All mandatory query parameters must be defined.<br />- Values for query parameters in the request must match the specific data type and format, including all limitations (e.g., `externalId` must be unique).
      content:
        application/json:
          schema:
            properties:
              code:
                description: HTTP response code.
                type: number
                enum:
                - 400
              message:
                description: Invalid request.
                type: string
                enum:
                - invalid request
            example:
              code: 400
              message: 'invalid request: start format error: parsing time "2022-09p13T07:25:00.52+00:00" as "2006-01-02T15:04:05Z07:00": cannot parse "p13T07:25:00.52+00:00" as "-".'
    serverError:
      description: Returned in case of an internal server error.
      content:
        application/json:
          schema:
            properties:
              message:
                description: ''
                type: string
                enum:
                - 500 Internal Server Error.
  securitySchemes:
    api_key:
      in: header
      name: Authorization
      type: apiKey
