aid: paack
name: Paack
description: >-
  Paack is a technology-driven last-mile parcel delivery company serving
  e-commerce retailers across Spain, Portugal, the United Kingdom, France and
  Italy. Founded in 2015 and headquartered in Barcelona, Paack provides
  scheduled, precise home delivery, returns and reverse logistics, real-time
  parcel tracking, and proof of delivery. Its developer platform exposes REST
  APIs for order creation and management, label generation, delivery coverage
  and postcode-zone lookup, and real-time tracking events, complemented by
  webhooks for event notifications and an sFTP batch integration. APIs are
  authenticated with Auth0 OAuth2 client-credentials JSON Web Tokens and
  documented on a ReadMe developer hub with staging and production environments.
