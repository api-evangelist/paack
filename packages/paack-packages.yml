note: >-
  Paack publishes a first-party client SDK documented on its ReadMe developer
  hub, with a primary Python implementation and generated client libraries in
  additional languages (PHP, Java, Go). The SDK wraps the Orders, POD, Labeler,
  Pull (tracking) and Coverage APIs and handles authentication and validation.
  Public package-registry coordinates are not advertised in the docs; libraries
  are distributed to integrating retailers by Paack's Customer Solutions team,
  so registry URLs are omitted rather than fabricated.
